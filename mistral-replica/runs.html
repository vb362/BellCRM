<section id="crm-runs" hidden aria-label="Runs">
  <div class="runs-tabs" role="tablist" aria-label="Run type">
    <button id="runs-tab-all" type="button" role="tab" aria-selected="true" aria-controls="runs-results" data-run-filter="all">All</button>
    <button id="runs-tab-scraper" type="button" role="tab" aria-selected="false" aria-controls="runs-results" tabindex="-1" data-run-filter="scraper">Scraper runs</button>
    <button id="runs-tab-pipeline" type="button" role="tab" aria-selected="false" aria-controls="runs-results" tabindex="-1" data-run-filter="pipeline">Pipeline runs</button>
  </div>
  <div id="runs-results" role="tabpanel" aria-labelledby="runs-tab-all" tabindex="0">
    <div class="runs-table-scroll">
      <table class="runs-table" aria-label="Past runs">
        <thead><tr><th scope="col">ID</th><th scope="col">Type</th><th scope="col">Status</th><th scope="col">Outcome</th><th scope="col"><span class="runs-sr-only">Actions</span></th></tr></thead>
        <tbody id="runs-body"></tbody>
      </table>
    </div>
    <p id="runs-empty" hidden>No runs yet. Create a new run to get started.</p>
  </div>
  <p id="runs-announcement" class="runs-sr-only" role="status" aria-live="polite"></p>
</section>
